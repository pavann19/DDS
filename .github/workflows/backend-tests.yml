name: Backend tests

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    runs-on: ubuntu-latest
    # Hard cap so a hung test fails loudly instead of burning a 6h runner
    # (a prior run sat for 1h18m on the pytest step before manual cancel).
    timeout-minutes: 15
    env:
      # SHAP's TreeExplainer + numpy/OpenMP oversubscribe and can deadlock
      # in a worker thread on a 2-core runner. Pin the math-library pools.
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # The deployed ML artifacts (*.pkl + optimal_features.json +
      # feature_info.json + anomaly_feature_bounds.json) are committed to the
      # repo, so CI tests the exact same trained model as local. Regenerate
      # deliberately via data_prep.py -> genetic_optimizer.py ->
      # model_pipeline.py, never on every CI run.
      - name: Run pytest with coverage
        run: pytest tests/ --cov=app --cov-report=term-missing --cov-report=xml -v --timeout=120 --timeout-method=thread
