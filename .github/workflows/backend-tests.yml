name: Backend tests

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    runs-on: ubuntu-latest
    # Hard cap so a hung test fails loudly instead of burning a 6h runner
    # (a prior run sat for 1h18m on the pytest step before manual cancel).
    timeout-minutes: 20
    env:
      # SHAP's TreeExplainer + numpy/OpenMP oversubscribe and can deadlock
      # in a worker thread on a 2-core runner. Pin the math-library pools.
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # The trained binary artifacts (*.pkl, metrics.json,
      # processed_telemetry.csv) are build output -- regenerated here, never
      # committed. The one non-reproducible input, optimal_features.json
      # (genetic_optimizer.py's exhaustive-search result), IS committed as
      # pinned config so this regeneration is deterministic. Cached on the
      # dataset + the scripts + that pinned config.
      - name: Cache ML artifacts
        id: ml-artifacts
        uses: actions/cache@v4
        with:
          path: |
            processed_telemetry.csv
            feature_info.json
            best_model.pkl
            scaler.pkl
            label_encoder.pkl
            metrics.json
            anomaly_model.pkl
            anomaly_feature_bounds.json
          key: ml-artifacts-${{ hashFiles('OBD_2_dataset.csv', 'data_prep.py', 'model_pipeline.py', 'optimal_features.json', 'app/services/anomaly_detector.py') }}

      - name: Generate ML artifacts
        if: steps.ml-artifacts.outputs.cache-hit != 'true'
        run: |
          python data_prep.py
          python model_pipeline.py
          # Anomaly IsolationForest: trained on the 7-feature set the shipped
          # anomaly_model.pkl / test fixtures use (all 8 minus CO2). This
          # list is pinned here because it is not currently derivable from
          # any committed config -- see tests/test_anomaly_detector.py.
          python -c "from app.services.anomaly_detector import AnomalyDetector; feats = ['Altitude', 'Coolant', 'Litre per 100km(Instant)', 'RPM', 'RPM_Delta', 'CO2_Delta', 'Fuel_Rate_Delta']; raise SystemExit(0 if AnomalyDetector().train(features=feats) else 1)"

      - name: Run pytest with coverage
        run: pytest tests/ --cov=app --cov-report=term-missing --cov-report=xml -v --timeout=120 --timeout-method=thread
